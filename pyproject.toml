[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelsmith"
version = "0.1.0"
description = "Automatic GPU kernel optimizer for PyTorch operations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "flipslidersand" }]
keywords = ["triton", "gpu", "pytorch", "kernel", "optimization", "autotuning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "torch>=2.3",
    "jinja2>=3.1",
]

[project.scripts]
forge = "forge.cli:main"

[project.urls]
Homepage = "https://github.com/flipslidersand/forge"
Repository = "https://github.com/flipslidersand/forge"
Issues = "https://github.com/flipslidersand/forge/issues"

[project.optional-dependencies]
gpu = [
    "triton>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pyright>=1.1",
    "build>=1.0",
    # test_ollama_generator は ollama + pydantic を import/patch するため
    # クリーン venv でも green にするよう ollama extra を取り込む
    "kernelsmith[ollama]",
]
llm = [
    "anthropic>=0.69",
    "pydantic>=2",
]
ollama = [
    "ollama>=0.4",
    "pydantic>=2",
]
search = [
    "optuna>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.ruff]
line-length = 100
src = ["src"]
exclude = [
    "examples",
    "docs",
    "*.md",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "F841", "UP035"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "gpu: requires NVIDIA GPU (skip with -m 'not gpu')",
    "smoke: lightweight GPU smoke test for PR validation (subset of gpu)",
]

[tool.coverage.run]
source = ["src/forge"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
