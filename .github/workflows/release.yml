name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache semantic-release
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: semantic_release
        run: |
          semantic-release
          # Get version from latest git tag (semantic-release creates it)
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo '')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "RELEASED_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Build
        if: steps.semantic_release.outputs.version != ''
        run: |
          pip install poetry
          poetry build

      - name: Publish to PyPI
        if: steps.semantic_release.outputs.version != ''
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.RELEASED_VERSION }}" ]; then
            echo "✅ Released version: ${{ env.RELEASED_VERSION }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No release needed" >> $GITHUB_STEP_SUMMARY
          fi
