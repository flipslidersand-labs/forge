name: Release

on:
  push:
    branches:
      - master
  # 既存タグの PyPI 公開だけを手動で行う経路(#314)。release ジョブは走らせない。
  workflow_dispatch:
    inputs:
      tag:
        description: "PyPI に公開する既存の git タグ (例: v1.20.6)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # 次のリリースが major か判定する(dry-run。何も公開しない)。major は release-major
  # environment(Required reviewers)で人の承認を待つ。PyPI 公開は戻せないため、
  # マージ経路(人/自動)によらずここで止める。minor/patch は従来どおり自動。
  plan:
    # workflow_dispatch(既存タグの公開)では release を走らせないので判定も不要
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.p.outputs.major }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install semantic-release
        run: |
          # バージョンは package.json + package-lock.json で固定(#359)
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Detect major bump
        id: p
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=$(semantic-release --dry-run --no-ci 2>&1 || true)
          echo "$OUT" | tail -20
          NEXT=$(echo "$OUT" | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          CUR=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -n "$NEXT" ] && [ "${NEXT%%.*}" != "${CUR%%.*}" ]; then
            echo "major=true" >> "$GITHUB_OUTPUT"
            echo "::notice::major release ($CUR -> $NEXT): release-major の承認待ち"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    # workflow_dispatch では走らせない(push 時の動作は従来どおり)
    if: github.event_name == 'push'
    environment: ${{ needs.plan.outputs.major == 'true' && 'release-major' || 'release' }}
    # linux-general ARC ランナーには docker socket が無く、pypa/gh-action-pypi-publish
    # (docker composite action) が "failed to connect to the docker API" で毎回落ちる。
    # PyPI publish を含む release ジョブは ubuntu-latest 固定。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache semantic-release
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install semantic-release
        run: |
          # バージョンは package.json + package-lock.json で固定(#359)
          npm ci --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: semantic_release
        run: |
          # #331: git describe --tags --abbrev=0 は semantic-release が今回
          # 新タグを作ったかに関わらず常に最新タグを返すため、実行前後で
          # タグを比較して「今回リリースが実際に行われたか」を判定する。
          # chore(deps) 等の no-release commit だけの push で PyPI 再publish
          # を試みて（同一バージョンreject で）失敗するのを防ぐ。
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          semantic-release
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$NEW_TAG" != "$PREV_TAG" ]; then
            VERSION="${NEW_TAG#v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASED_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.semantic_release.outputs.version != ''
        run: |
          # バージョンは hatch-vcs が直前に作られたタグ(HEAD)から導出する(#390)
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.semantic_release.outputs.version != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 多重実行時の安全弁。#331 の主対策（新タグ検出）が効いていれば
          # 通常は発火しないが、レース等の想定外ケースでも publish ジョブ
          # 自体を失敗させない。
          skip-existing: true

      - name: Create summary
        if: always()
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ env.RELEASED_VERSION }}" ]; then
            echo "✅ Released version: ${{ env.RELEASED_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No release needed" >> "$GITHUB_STEP_SUMMARY"
          fi


  # 既存タグを PyPI に公開する専用ジョブ(#314)。
  # release ジョブは新タグが無いと Build/Publish をスキップして緑のまま終わるため、
  # PyPI 側の Trusted Publisher を直した後に既存タグを公開する経路として使う。
  # PyPI の Trusted Publisher は workflow 名 release.yml で登録されているので、
  # 別ファイルにせずこのファイルに置く。
  publish-tag:
    if: github.event_name == 'workflow_dispatch'
    # PyPI の Trusted Publisher は environment まで照合する。無いと environment: MISSING で
    # invalid-publisher になる(10/24 run 40102755795)。承認待ちも release と同じにする
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate tag input
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$TAG' は v<major>.<minor>.<patch> (例: v1.20.6) の形式で指定してください"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build
        run: |
          # バージョンは hatch-vcs がチェックアウトしたタグから導出する(#390, #399)
          pip install build
          python -m build

      - name: Check dist version matches tag
        run: |
          ls dist
          test -n "$(ls dist)"
          for f in dist/*; do
            case "$(basename "$f")" in
              kernelsmith-"$VERSION"-*|kernelsmith-"$VERSION".tar.gz) ;;
              *) echo "::error::$f は kernelsmith $VERSION ではありません(タグと build バージョンの不一致)"; exit 1 ;;
            esac
          done

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 一部だけ上がった状態からの再実行を許す。公開の成否は次の step で判定する。
          skip-existing: true

      - name: Verify release is on PyPI
        run: |
          # 緑なのに公開ゼロ、を防ぐ。CDN 反映遅れを見込んで数回リトライする。
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://pypi.org/pypi/kernelsmith/json \
              | jq -e --arg v "$VERSION" '(.releases[$v] // []) | length > 0' >/dev/null; then
              echo "kernelsmith $VERSION は PyPI に公開済みです"
              echo "✅ kernelsmith $VERSION is on PyPI" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "kernelsmith $VERSION はまだ PyPI の releases にありません (試行 $i/6)"
            sleep 10
          done
          echo "::error::kernelsmith $VERSION が PyPI の releases に見つかりません"
          exit 1
