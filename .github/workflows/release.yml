name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # 次のリリースが major か判定する(dry-run。何も公開しない)。major は release-major
  # environment(Required reviewers)で人の承認を待つ。PyPI 公開は戻せないため、
  # マージ経路(人/自動)によらずここで止める。minor/patch は従来どおり自動。
  plan:
    runs-on: ubuntu-latest
    outputs:
      major: ${{ steps.p.outputs.major }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github \
            conventional-changelog-conventionalcommits
      - name: Detect major bump
        id: p
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT=$(semantic-release --dry-run --no-ci 2>&1 || true)
          echo "$OUT" | tail -20
          NEXT=$(echo "$OUT" | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
          CUR=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          if [ -n "$NEXT" ] && [ "${NEXT%%.*}" != "${CUR%%.*}" ]; then
            echo "major=true" >> "$GITHUB_OUTPUT"
            echo "::notice::major release ($CUR -> $NEXT): release-major の承認待ち"
          else
            echo "major=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    environment: ${{ needs.plan.outputs.major == 'true' && 'release-major' || 'release' }}
    # linux-general ARC ランナーには docker socket が無く、pypa/gh-action-pypi-publish
    # (docker composite action) が "failed to connect to the docker API" で毎回落ちる。
    # PyPI publish を含む release ジョブは ubuntu-latest 固定。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache semantic-release
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github \
            conventional-changelog-conventionalcommits

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: semantic_release
        run: |
          # #331: git describe --tags --abbrev=0 は semantic-release が今回
          # 新タグを作ったかに関わらず常に最新タグを返すため、実行前後で
          # タグを比較して「今回リリースが実際に行われたか」を判定する。
          # chore(deps) 等の no-release commit だけの push で PyPI 再publish
          # を試みて（同一バージョンreject で）失敗するのを防ぐ。
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          semantic-release
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)
          if [ "$NEW_TAG" != "$PREV_TAG" ]; then
            VERSION="${NEW_TAG#v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "RELEASED_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build
        if: steps.semantic_release.outputs.version != ''
        run: |
          # バージョンは hatch-vcs が直前に作られたタグ(HEAD)から導出する(#390)
          pip install build
          python -m build

      - name: Publish to PyPI
        if: steps.semantic_release.outputs.version != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 多重実行時の安全弁。#331 の主対策（新タグ検出）が効いていれば
          # 通常は発火しないが、レース等の想定外ケースでも publish ジョブ
          # 自体を失敗させない。
          skip-existing: true

      - name: Create summary
        if: always()
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ env.RELEASED_VERSION }}" ]; then
            echo "✅ Released version: ${{ env.RELEASED_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ No release needed" >> "$GITHUB_STEP_SUMMARY"
          fi

