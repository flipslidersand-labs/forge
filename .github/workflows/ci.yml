name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/python-test.yml@main
    with:
      pre-install: pip install torch --index-url https://download.pytorch.org/whl/cpu
      install-extras: "dev,llm,ollama"
      pytest-args: '-k "not gpu"'
      coverage-threshold: 10

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,llm,ollama]"
      - name: pyright
        run: pyright src/

  gpu-smoke:
    name: GPU Smoke Test (PR)
    runs-on: [self-hosted, gpu]
    if: >-
      github.event_name == 'pull_request' &&
      vars.GPU_RUNNER_AVAILABLE == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nvidia-smi check
        run: nvidia-smi
      - name: Install dependencies (CUDA torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu124
          pip install -e ".[dev,gpu]"
      - name: Run GPU smoke tests
        run: pytest -m "smoke" -q --tb=short

  gpu-test:
    name: GPU Test (RTX 4070 / RTX 4060 fallback)
    runs-on: [self-hosted, gpu]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.GPU_RUNNER_AVAILABLE == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nvidia-smi check
        run: nvidia-smi
      - name: Install dependencies (CUDA torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cu124
          pip install -e ".[dev,llm,ollama]"
      - name: Run GPU tests
        run: pytest -k "gpu" -q --tb=short
