name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: arc-dev-nodee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff>=0.4"
      - name: ruff check
        run: ruff check src/ tests/
      - name: ruff format
        run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: arc-dev-nodee
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,llm,ollama]"
      - name: Run tests (non-GPU) with coverage
        run: pytest -k "not gpu" -q --cov=forge --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  typecheck:
    name: Type check
    runs-on: arc-dev-nodee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,llm,ollama]"
      - name: pyright
        run: pyright src/
